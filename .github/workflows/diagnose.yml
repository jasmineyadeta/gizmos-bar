name: Diagnose orders
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      API: https://api.supabase.com/v1
    steps:
      - name: Diagnose
        run: |
          ref=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API/projects" | jq -r '([.[] | select(.name | ascii_downcase | test("gizmo"))] + .)[0].id')
          q() { jq -n --arg q "$1" '{query: $q}' | curl -s -X POST "$API/projects/$ref/database/query" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @-; echo; }
          echo "== settings"; q "select mode, timezone, public.bar_is_open() as open_now from public.settings"
          echo "== recent orders"; q "select created_at, guest_name, item_name, status from public.orders order by created_at desc limit 5"
          echo "== place_order grants"; q "select grantee, privilege_type from information_schema.routine_privileges where routine_name = 'place_order'"
          echo "== out of stock"; q "select key from public.ingredients where not in_stock"
          anon=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API/projects/$ref/api-keys" | jq -r '([.[] | select(.name == "anon")] + [.[] | select(.type == "publishable")])[0].api_key')
          echo "== function with unknown drink (expect BAR_CLOSED or NO_SUCH_DRINK text)"
          curl -s -w ' [%{http_code}]\n' -X POST "https://$ref.supabase.co/functions/v1/bar" -H "apikey: $anon" -H "Content-Type: application/json" \
            -d '{"action":"order","name":"Diagnose","item_id":"00000000-0000-0000-0000-000000000000"}'
          echo "== function logs"
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ); start=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)
          for t in function_logs function_edge_logs; do
            curl -s -G "$API/projects/$ref/analytics/endpoints/logs.all" --data-urlencode "sql=select timestamp, event_message from $t order by timestamp desc limit 25" \
              --data-urlencode "iso_timestamp_start=$start" --data-urlencode "iso_timestamp_end=$end" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -c '.error // empty, (.result[]? | [.timestamp, .event_message])' | head -30
          done
