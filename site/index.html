<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gizmo's Bar</title>
  <meta name="theme-color" content="#0a1424">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <main>
    <header class="hero">
      <div id="heroGizmo"></div>
      <div>
        <h1 id="barName">Gizmo's Bar</h1>
        <p><span id="status" class="pill">Checking...</span> <span id="hours" class="small muted"></span></p>
        <a href="#board" class="board-link hidden" id="boardLink">🏆 Crew leaderboard</a>
      </div>
    </header>
    <div class="rope" aria-hidden="true"></div>

    <section id="closed" class="card notice hidden">
      <h2>Last call has passed</h2>
      <p id="closedMsg"></p>
      <p class="small">You can still browse the menu.</p>
    </section>

    <section id="placed" class="card notice hidden">
      <div id="placedGizmo"></div>
      <h2 id="placedTitle">Gizmo's on it!</h2>
      <p id="placedText"></p>
      <button class="btn" id="again">Order another</button>
    </section>

    <div class="card" id="nameCard">
      <label for="name">Your name (so Gizmo knows who it's for)</label>
      <input id="name" maxlength="40" autocomplete="given-name" placeholder="e.g. Granny Sandy">
    </div>

    <section id="browse">
      <h2 class="browse-h">What are you in the mood for?</h2>
      <div class="circles" id="spirits"></div>
      <div class="moodrow" id="moods"></div>
      <div class="row browse-bar">
        <span class="muted small grow" id="count"></span>
        <button class="btn btn-small" id="surprise">🎲 Surprise me</button>
      </div>
      <div id="menu" class="grid"></div>
    </section>

    <section id="board" class="card board hidden">
      <h2>🏆 Crew leaderboard</h2>
      <p class="small muted" style="margin:0 0 12px">Most drinks ordered, all time. Gizmo keeps count.</p>
      <ol id="boardList"></ol>
    </section>
  </main>

  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetName">
    <div class="stack">
      <img id="sheetImg" class="sheet-img" alt="">
      <div>
        <h2 id="sheetName"></h2>
        <div class="d" id="sheetDesc"></div>
      </div>
      <label class="topshelf-opt hidden" id="topOpt"><input type="checkbox" id="topChk"> <span>⭐ Make it top shelf <span class="muted" id="topName"></span></span></label>
      <div>
        <label for="notes">Anything special? (optional)</label>
        <textarea id="notes" maxlength="200" placeholder="Extra ice, no salt..."></textarea>
      </div>
      <button class="btn btn-block" id="orderBtn">Order it</button>
      <button class="btn-ghost btn-block" id="cancelBtn">Never mind</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
